name: Refresh Trade by Commodity

# Scheduled + manual. Own day, separate from refresh.yml/other datasets —
# see the rate-limit note in refresh.yml: EasyData allows 250 requests/hour
# and this dataset alone is 246 series, so it needs its own workflow run
# rather than sharing an hour with anything else.
on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas || true

      - name: Ensure public/ exists
        run: mkdir -p public

      - name: Refresh + build Trade by Commodity
        env:
          EASYDATA_API_KEY: ${{ secrets.EASYDATA_API_KEY }}
        run: |
          python3 refresh.py --map series_map.trade_commodities.json --start 2003-07 --out data.trade_commodities.json
          python3 build.py --config config.trade_commodities.js --data data.trade_commodities.json --logo logo.png --out public/trade_commodities.html

      - name: Commit rebuilt files
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/*.html data.*.json
          git commit -m "Auto-refresh trade_commodities [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
