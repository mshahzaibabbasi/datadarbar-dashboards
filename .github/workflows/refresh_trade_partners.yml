name: Refresh Trade by Country

# Scheduled + manual. This is the biggest of the 5 new datasets — 440
# series against a 250/request-per-hour cap, so a single run WILL cross an
# hour boundary and hit 429s partway through. refresh.py's own backoff
# (5,10,20,40,80s, capped, 5 retries) handles that, but expect this run to
# take noticeably longer than the others rather than reading it as stuck.
on:
  schedule:
    - cron: "0 6 * * 3"   # Wednesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas || true

      - name: Ensure public/ exists
        run: mkdir -p public

      - name: Refresh + build Trade by Country
        env:
          EASYDATA_API_KEY: ${{ secrets.EASYDATA_API_KEY }}
        run: |
          python3 refresh.py --map series_map.trade_partners.json --start 2003-07 --out data.trade_partners.json
          python3 build.py --config config.trade_partners.js --data data.trade_partners.json --logo logo.png --out public/trade_partners.html

      - name: Commit rebuilt files
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/*.html data.*.json
          git commit -m "Auto-refresh trade_partners [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
