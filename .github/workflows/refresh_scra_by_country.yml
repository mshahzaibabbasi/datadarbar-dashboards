name: Refresh SCRA by Country

# 495 series — will cross the 250/hour cap in a single run, same situation
# as refresh_trade_partners.yml. Scheduled the evening after Outstanding
# Advances (small, finishes well within 12 hours) rather than sharing a
# start time with it.
on:
  schedule:
    - cron: "0 18 * * 5"   # Fridays 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas || true

      - name: Ensure public/ exists
        run: mkdir -p public

      - name: Refresh + build SCRA by Country
        env:
          EASYDATA_API_KEY: ${{ secrets.EASYDATA_API_KEY }}
        run: |
          python3 refresh.py --map series_map.scra_by_country.json --start 2016-06 --out data.scra_by_country.json
          python3 build.py --config config.scra_by_country.js --data data.scra_by_country.json --logo logo.png --out public/scra_by_country.html

      - name: Commit rebuilt files
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/*.html data.*.json
          git commit -m "Auto-refresh scra_by_country [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
