name: Refresh Foreign Investment by Country

# 291 series. Scheduled the evening after Trade by Commodity (finishes
# well within 12 hours).
on:
  schedule:
    - cron: "0 18 * * 2"   # Tuesdays 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pandas || true

      - name: Ensure public/ exists
        run: mkdir -p public

      - name: Refresh + build Foreign Investment by Country
        env:
          EASYDATA_API_KEY: ${{ secrets.EASYDATA_API_KEY }}
        run: |
          python3 refresh.py --map series_map.foreign_investment_by_country.json --start 2007-07 --out data.foreign_investment_by_country.json
          python3 build.py --config config.foreign_investment_by_country.js --data data.foreign_investment_by_country.json --logo logo.png --out public/foreign_investment_by_country.html

      - name: Commit rebuilt files
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/*.html data.*.json
          git commit -m "Auto-refresh foreign_investment_by_country [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
